<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="713px" preserveAspectRatio="none" style="width:1039px;height:713px;background:#FFFFFF;" version="1.1" viewBox="0 0 1039 713" width="1039px" zoomAndPan="magnify"><title>Deployment Diagram - Moderated LMS v1.x (single school computer, offline)</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="507.9648" x="257.7676" y="24.5332">Deployment Diagram - Moderated LMS v1.x (single school computer, offline)</text></g><!--cluster PC--><g class="cluster" data-entity="PC" data-source-line="4" data-uid="ent0002" id="cluster_PC"><polygon fill="none" points="14,193.6094,24,183.6094,745,183.6094,745,686.6094,735,696.6094,14,696.6094,14,193.6094" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="735" x2="745" y1="193.6094" y2="183.6094"/><line style="stroke:#181818;stroke-width:1;" x1="14" x2="735" y1="193.6094" y2="193.6094"/><line style="stroke:#181818;stroke-width:1;" x1="735" x2="735" y1="193.6094" y2="696.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="114.3447" x="318.3276" y="211.1426">School computer</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="59.1582" x="345.9209" y="228.752">&#171;device&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="254.7891" x="248.1055" y="246.3613">Windows 10/11 x64 (or Ubuntu 22.04+)</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="159.4824" x="295.7588" y="263.9707">&gt;= 2 GB RAM, dual-core</text></g><!--cluster OS--><g class="cluster" data-entity="OS" data-source-line="5" data-uid="ent0003" id="cluster_OS"><polygon fill="none" points="48,279.6094,58,269.6094,539,269.6094,539,670.6094,529,680.6094,48,680.6094,48,279.6094" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="529" x2="539" y1="279.6094" y2="269.6094"/><line style="stroke:#181818;stroke-width:1;" x1="48" x2="529" y1="279.6094" y2="279.6094"/><line style="stroke:#181818;stroke-width:1;" x1="529" x2="529" y1="279.6094" y2="680.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="118.2617" x="230.3691" y="297.1426">Operating system</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="168.8271" x="205.0864" y="314.752">&#171;execution environment&#187;</text></g><!--entity Users--><g class="entity" data-entity="Users" data-source-line="14" data-uid="ent0009" id="entity_Users"><ellipse cx="419.7754" cy="51.1094" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M419.7754,59.1094 L419.7754,86.1094 M406.7754,67.1094 L432.7754,67.1094 M419.7754,86.1094 L406.7754,101.1094 M419.7754,86.1094 L432.7754,101.1094" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.8545" x="322.5" y="117.1426">Staff and students</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="194.5508" x="322.5" y="134.752">(one at a time, at the keyboard)</text></g><g class="entity" data-entity="GMN14" data-source-line="22" data-uid="ent0015" id="entity_GMN14"><path d="M753.5,329.6094 L753.5,405.0156 L1032.437,405.0156 L1032.437,339.6094 L1022.437,329.6094 L753.5,329.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1022.437,329.6094 L1022.437,339.6094 L1032.437,339.6094 L1022.437,329.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.937" x="759.5" y="348.1045">No network connection is required (NFR-09).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.6924" x="759.5" y="364.4561">All four roles use the same executable; the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.5151" x="759.5" y="380.8076">role is decided at login. Users log out so</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.4897" x="759.5" y="397.1592">the next person can log in.</text></g><!--entity BK--><g class="entity" data-entity="BK" data-source-line="11" data-uid="ent0008" id="entity_BK"><path d="M549.5,615.6094 L590.5,615.6094 A3.75,3.75 0 0 1 593,618.1094 L600,636.6094 L734.7959,636.6094 A2.5,2.5 0 0 1 737.2959,639.1094 L737.2959,686.3281 A2.5,2.5 0 0 1 734.7959,688.8281 L549.5,688.8281 A2.5,2.5 0 0 1 547,686.3281 L547,618.1094 A2.5,2.5 0 0 1 549.5,615.6094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="547" x2="600" y1="636.6094" y2="636.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.2959" x="557" y="658.1426">Backup folder / USB drive</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.2686" x="557" y="675.752">(daily copy of lms.db)</text></g><!--entity EXE--><g class="entity" data-entity="EXE" data-source-line="6" data-uid="ent0004" id="entity_EXE"><rect fill="#F1F1F1" height="93.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="220.6338" x="309.5" y="320.6094"/><polygon fill="#F1F1F1" points="513.1338,325.6094,513.1338,339.6094,525.1338,339.6094,525.1338,331.6094,519.1338,325.6094,513.1338,325.6094" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="519.1338" x2="519.1338" y1="325.6094" y2="331.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="525.1338" x2="519.1338" y1="331.6094" y2="331.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="48.2344" x="319.5" y="348.1426">lms.exe</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.7031" x="319.5" y="365.752">(statically linked:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.6338" x="319.5" y="383.3613">lms_core, lms_ui, SQLite 3.46,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.8408" x="319.5" y="400.9707">Argon2 reference)</text></g><!--entity DB--><g class="entity" data-entity="DB" data-source-line="7" data-uid="ent0005" id="entity_DB"><rect fill="#F1F1F1" height="58.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="220.6475" x="286.5" y="485.6094"/><polygon fill="#F1F1F1" points="490.1475,490.6094,490.1475,504.6094,502.1475,504.6094,502.1475,496.6094,496.1475,490.6094,490.1475,490.6094" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="496.1475" x2="496.1475" y1="490.6094" y2="496.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="502.1475" x2="496.1475" y1="496.6094" y2="496.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="41.2344" x="296.5" y="513.1426">lms.db</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.6475" x="296.5" y="530.752">(SQLite database, WAL mode)</text></g><!--entity WAL--><g class="entity" data-entity="WAL" data-source-line="8" data-uid="ent0006" id="entity_WAL"><rect fill="#F1F1F1" height="40.6094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="180.