# Continuous integration: build and test on every push and pull request (Phase 6).
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLMS_WARNINGS_AS_ERRORS=${{ matrix.os == 'ubuntu-latest' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Unit, integration and system tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} -L functional --output-on-failure

      - name: Performance tests (NFR-01..03)
        if: matrix.build_type == 'Release'
        run: ctest --test-dir build -C Release -L performance --output-on-failure -V

  coverage:
    name: Coverage (business-logic layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: pip install gcovr
      - name: Configure with coverage
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLMS_ENABLE_COVERAGE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build -L functional --output-on-failure
      - name: Coverage report (lib/ only, target >= 70 % lines)
        run: |
          mkdir -p coverage
          gcovr --root . --filter 'lib/' --object-directory build \
                --txt coverage/summary.txt --html-details coverage/index.html \
                --fail-under-line 70 --print-summary
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  static-analysis:
    name: Static analysis (cppcheck + clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install analysers
        run: sudo apt-get update && sudo apt-get install -y cppcheck clang-tidy
      - name: Configure (exports compile_commands.json)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build (generates headers needed by the analysers)
        run: cmake --build build --parallel
      - name: cppcheck
        run: >
          cppcheck --enable=warning,style,performance,portability --std=c++17 --language=c++
          --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction
          --suppress=useStlAlgorithm --check-level=exhaustive --error-exitcode=1 -I lib/include -I app/include lib/src app/src
      - name: clang-tidy
        run: >
          find lib/src app/src -name '*.cpp' -print0 |
          xargs -0 clang-tidy -p build --quiet 2>&1 | tee clang-tidy.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang-tidy.txt

  release:
    name: Package release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, coverage]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLMS_BUILD_TESTS=OFF -DLMS_STATIC_RUNTIME=ON
      - run: cmake --build build --config Release --parallel
      - run: cpack --config build/CPackConfig.cmake -C Release -B dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: docs/09-deployment/release-notes.md
